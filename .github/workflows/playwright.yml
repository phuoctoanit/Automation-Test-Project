name: Playwright Tests

on:
  push:
    branches: [ features/v1, main ]
  pull_request:
    branches: [ features/v1, main ]

permissions:
  contents: write    

jobs:
  execute:
    name: 🧪 Run Playwright Tests
    runs-on: ubuntu-latest
    env:
      env: dev
      AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }} # Removed or comment out if not defined
      USERNAME: ${{ secrets.USERNAME }}
      PASSWORD: ${{ secrets.PASSWORD }} # Uncomment if PASSWORD secret is defined in repository settings
    strategy:
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v3

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧱 Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Start mock api server
        run: |
          if [ -z "${{ secrets.AUTH_TOKEN }}" ]; then
            echo "AUTH_TOKEN is not defined"
            exit 1
          fi
          if [ -z "${{ secrets.USERNAME }}" ]; then
            echo "USERNAME is not defined"
            exit 1
          fi
          if [ -z "${{ secrets.PASSWORD }}" ]; then
            echo "PASSWORD is not defined"
            exit 1
          fi

          echo "Starting mock API server from script..."
          chmod +x setups/start-mock-api.sh
          ./setups/start-mock-api.sh &
          sleep 2 # Wait for the server to start
        
      - name: ▶️ Run Playwright tests on UI
        run: |
          echo "Running Playwright tests..."
          ENV=${{ env.env }} npx playwright test tests --project=${{ matrix.browser }} || true
          echo "Playwright tests completed."   

      - name: 📝 Check if Playwright report exists
        if: always()
        run: |
          echo "Checking for Playwright report..."
          if [ -d playwright-report-${{ matrix.browser }} ]; then
            echo "✅ Report exists."
          else
            echo "❌ Report directory not found!"
          fi  
      
      - name: 📤 Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report
          if-no-files-found: warn

      - name: 📁 Check Allure Results
        if: always()
        run: |
          echo "Checking allure-results..."
          ls -la
          ls -la allure-results-${{ matrix.browser }} || echo "❌ No allure-results directory"

      - name: 📤 Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results
          if-no-files-found: warn    

  publish:
    name: 🚀 Publish Allure Report
    needs: execute
    runs-on: ubuntu-latest

    steps:

      - name: Download Allure History
        uses: actions/download-artifact@v4
        with:
          name: allure-history
          path: allure-history
        continue-on-error: true

      - name: ♻️ Copy Allure history
        run: |
          if [ -d "allure-history" ] && [ -d "allure-results" ]; then
            cp -r allure-history/* allure-results/history/ || true
          fi

      - name: 📊 Install Allure CLI
        run: npm install -g allure-commandline

      - name: Generate Allure Report
        run: |
          rm -rf allure-report
          npx allure generate allure-results -o allure-report

      - name: 📦 Upload Allure Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 5

      - name: Upload Allure History
        uses: actions/upload-artifact@v4
        with:
          name: allure-history
          path: allure-report/history

      - name: ⬇️ Download Allure Results Artifact
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results    

      - name: 📤 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          publish_branch: gh-pages       
       
